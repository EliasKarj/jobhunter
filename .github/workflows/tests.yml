# Testit ja käyttöliittymän käännös jokaisesta pushista ja pull requestista.
# Ajo ei käytä salaisuuksia eikä verkkoa testien aikana: ei API-kutsuja, ei ilmoitusten hakua
# (Duunitoria tai Kuntarekryä ei koskaan haeta GitHubin koneilta), ei ajastettuja ajoja.
name: Testit

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python-testit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - run: pip install -r requirements-ci.txt
      - run: python -m pytest -q

  frontend:
    name: Käyttöliittymän käännös
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run build
